<svg id="character" width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .neutral, .happy, .sad, .thinking { display: none; }
        
        /* Base styles for the face */
        .face-bg { fill: #FFEB3B; stroke: #FBC02D; stroke-width: 2; }
        .eye { fill: #455A64; }
        .cheek { fill: #FF80AB; opacity: 0.5; }
        .mouth { stroke: #455A64; stroke-width: 3; stroke-linecap: round; fill: none; }
        
        @keyframes think-pulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .thinking {
            animation: think-pulse 2s infinite ease-in-out;
        }
    </style>

    <!-- Neutral State -->
    <g class="neutral">
        <circle class="face-bg" cx="50" cy="50" r="45"/>
        <circle class="eye" cx="35" cy="42" r="5"/>
        <circle class="eye" cx="65" cy="42" r="5"/>
        <circle class="cheek" cx="25" cy="55" r="5"/>
        <circle class="cheek" cx="75" cy="55" r="5"/>
        <path class="mouth" d="M 35 65 Q 50 75 65 65"/>
    </g>

    <!-- Happy State -->
    <g class="happy">
        <circle class="face-bg" cx="50" cy="50" r="45"/>
        <!-- Joyful Arched Eyes -->
        <path d="M 28 45 Q 35 35 42 45" stroke="#455A64" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 58 45 Q 65 35 72 45" stroke="#455A64" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Bigger Rosy Cheeks -->
        <circle class="cheek" cx="22" cy="55" r="7"/>
        <circle class="cheek" cx="78" cy="55" r="7"/>
        <!-- Big Happy Smile -->
        <path class="mouth" d="M 30 65 Q 50 85 70 65" stroke-width="4"/>
    </g>

    <!-- Sad State -->
    <g class="sad">
        <circle class="face-bg" cx="50" cy="50" r="45"/>
        <!-- Droopy Sad Eyes -->
        <path d="M 28 40 Q 35 50 42 40" stroke="#455A64" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 58 40 Q 65 50 72 40" stroke="#455A64" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Tear drops -->
        <circle fill="#4FC3F7" cx="30" cy="55" r="3"/>
        <circle fill="#4FC3F7" cx="70" cy="55" r="3"/>
        <!-- Frown -->
        <path class="mouth" d="M 35 75 Q 50 65 65 75" stroke-width="4"/>
    </g>

    <!-- Thinking State -->
    <g class="thinking">
        <circle class="face-bg" cx="50" cy="50" r="45"/>
        <!-- One eye open, one squinting -->
        <circle class="eye" cx="35" cy="42" r="5"/>
        <path d="M 60 42 L 70 42" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
        <!-- Curious mouth -->
        <path class="mouth" d="M 45 70 Q 50 60 55 70"/>
    </g>
</svg>